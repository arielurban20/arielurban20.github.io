<style>
  :root{--naranja:#ff8a1f;--naranja2:#ffb347;--twitch:#9146ff;--fondo:#0e0a0d;--tarjeta:rgba(255,255,255,.06);--borde:rgba(255,255,255,.12)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--fondo);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       display:flex;justify-content:center;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:-20% -20% auto;height:70vh;z-index:0;
       background:radial-gradient(60% 60% at 50% 30%,rgba(255,138,31,.35),transparent 70%),radial-gradient(40% 40% at 80% 10%,rgba(145,70,255,.25),transparent 70%)}
  main{position:relative;z-index:1;width:100%;max-width:480px;padding:0 18px 40px}
  .banner{position:relative;margin:0 -18px;height:190px;background:url(img/banner.webp) center/cover;
          mask-image:linear-gradient(#000 55%,transparent);-webkit-mask-image:linear-gradient(#000 55%,transparent)}
  .avatar{display:block;width:112px;height:112px;margin:-70px auto 0;border-radius:50%;border:3px solid var(--naranja);
          box-shadow:0 0 0 5px rgba(255,138,31,.18),0 10px 30px rgba(0,0,0,.6);object-fit:cover;position:relative;background:#222}
  .logo{display:block;width:230px;max-width:70%;margin:10px auto 4px;filter:drop-shadow(0 6px 18px rgba(255,138,31,.35))}
  .lema{text-align:center;color:#e9dfe6;font-size:15px;line-height:1.45}
  .lema b{color:var(--naranja2)}
  .vivo{display:flex;align-items:center;gap:14px;margin:22px 0 14px;padding:16px 18px;border-radius:18px;text-decoration:none;color:#fff;
        background:linear-gradient(135deg,#9146ff,#6d2bd9);box-shadow:0 8px 30px rgba(145,70,255,.45);position:relative;overflow:hidden;
        animation:latido 2.4s ease-in-out infinite}
  .vivo::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);
        transform:translateX(-100%);animation:brillo 3.2s ease-in-out infinite}
  .vivo img{width:34px;height:34px}
  .vivo .t1{font-weight:800;font-size:18px;letter-spacing:.3px}
  .vivo .t2{font-size:13px;opacity:.9}
  .punto{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b3b;margin-right:6px;box-shadow:0 0 0 0 rgba(255,59,59,.7);animation:pulso 1.6s infinite}
  .flecha{margin-left:auto;font-size:22px;opacity:.9}
  .links{display:grid;gap:12px}
  .link{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;text-decoration:none;color:#fff;
        background:var(--tarjeta);border:1px solid var(--borde);backdrop-filter:blur(6px);transition:transform .15s,border-color .15s,background .15s}
  .link:hover,.link:active{transform:translateY(-2px);border-color:var(--naranja);background:rgba(255,138,31,.10)}
  .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
  .ico img{width:22px;height:22px}
  .link .n{font-weight:700;font-size:16px}
  .link .d{font-size:12.5px;color:#cbbfc8}
  .yt{background:#ff0033}.tt{background:#111;border:1px solid #333}.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}.fb{background:#1877f2}
  footer{margin-top:28px;text-align:center;font-size:12px;color:#8d8189}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  @keyframes brillo{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  @keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,59,59,.7)}70%{box-shadow:0 0 0 9px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
  @media (prefers-reduced-motion:reduce){.vivo,.vivo::after,.punto{animation:none}}
</style>
</head>
<body>
<main>
  <div class="banner" role="img" aria-label="ArielDR"></div>
  <img class="avatar" src="img/avatar.webp" alt="ArielDR">

  <p class="lema">Gamer dominicano 🇩🇴 · <b>GTA 6</b>, secretos y carros gratis<br>En vivo <b>todos los días</b></p>

    <span class="flecha">›</span>
  </a>

    <a class="link" href="https://www.instagram.com/arieldr.live/" target="_blank" rel="noopener">
      <span class="ico ig"><img src="img/instagram.svg" alt=""></span>
      <span><span class="n">Instagram</span><br><span class="d">@arieldr.live</span></span></a>
    <a class="link" href="https://www.facebook.com/1431084260090280" target="_blank" rel="noopener">
      <span class="ico fb"><img src="img/facebook.svg" alt=""></span>
      <span><span class="n">Facebook</span><br><span class="d">Ariel DR</span></span></a>
  </nav>

  <footer>© ArielDR</footer>
</main>
</body>
</html>
